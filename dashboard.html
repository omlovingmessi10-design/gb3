<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Desk — Arena</title>

    <!-- SUPABASE CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SECURITY BOUNCER -->
    <script>
        const currentUser = localStorage.getItem("currentUser");
        if (!currentUser) {
            window.location.href = "index.html"; 
        }
    </script>

    <style>
        /* =========================================================
           RESET & ROOT
        ========================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-dark: #050505;
            --panel-bg: rgba(20, 20, 20, 0.6);
            --border-glow: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f2;
            --text-muted: #888888;
            --accent: #f97316;
            --accent-hover: #ff8c3a;
        }

        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg-dark); color: var(--text-main);
            height: 100vh; overflow: hidden; display: flex;
        }

        body::before {
            content: ""; position: absolute; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #050505 60%);
        }

        /* =========================================================
           SIDEBAR NAVIGATION
        ========================================================= */
        .sidebar {
            width: 80px; height: 100%;
            background: linear-gradient(to bottom, rgba(10,10,10,0.9), rgba(5,5,5,0.95));
            border-right: 1px solid var(--border-glow);
            display: flex; flex-direction: column; align-items: center; padding: 20px 0;
            transition: width 0.3s ease; z-index: 50;
        }
        .sidebar:hover { width: 220px; }
        .brand-mark {
            width: 30px; height: 30px; margin-bottom: 40px;
            background: radial-gradient(circle, var(--text-main) 0%, #555 100%);
            border-radius: 4px; box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }
        .nav-item {
            width: 100%; display: flex; align-items: center; padding: 15px 25px; cursor: pointer; color: var(--text-muted);
            transition: all 0.2s ease; overflow: hidden; white-space: nowrap;
        }
        .nav-item:hover, .nav-item.active {
            color: var(--text-main); background: rgba(255,255,255,0.05); border-left: 3px solid var(--accent);
        }
        .nav-icon { min-width: 24px; font-weight: 700; font-size: 16px; margin-right: 20px; }
        .nav-label { font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0; transition: opacity 0.3s ease; }
        .sidebar:hover .nav-label { opacity: 1; }
        .logout-btn { margin-top: auto; border-left: 3px solid #ff4444; }
        .logout-btn:hover { background: rgba(255,68,68,0.1); color: #ff4444; }

        /* =========================================================
           MAIN WORKSPACE
        ========================================================= */
        .workspace { flex-grow: 1; display: flex; flex-direction: column; height: 100%; position: relative; }

        .topbar {
            height: 70px; width: 100%; display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; border-bottom: 1px solid var(--border-glow); backdrop-filter: blur(10px);
        }
        .topbar-left { font-size: 12px; font-weight: 500; letter-spacing: 0.15em; color: var(--text-muted); }
        .topbar-right { display: flex; align-items: center; gap: 20px; }
        .user-profile { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.05em; }
        .user-avatar {
            width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.2);
        }

        .arena-grid {
            flex-grow: 1; padding: 40px; overflow-y: auto;
            display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; align-content: flex-start;
        }

        /* =========================================================
           COMMAND CENTER (EMT 1) UI
        ========================================================= */
        .command-center {
            grid-column: span 12;
            background: var(--panel-bg); border: 1px solid var(--border-glow); border-radius: 12px; padding: 30px;
            backdrop-filter: blur(20px); min-height: 400px;
        }
        .module-header {
            font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--text-muted); margin-bottom: 25px; border-bottom: 1px solid var(--border-glow); padding-bottom: 15px;
        }
        
        /* Task Input Area */
        .task-input-container {
            display: flex; gap: 10px; margin-bottom: 30px;
        }
        .task-input {
            flex-grow: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--border-glow);
            padding: 15px 20px; border-radius: 8px; color: var(--text-main); font-size: 15px; outline: none;
            transition: border-color 0.3s ease;
        }
        .task-input:focus { border-color: var(--accent); }
        .add-task-btn {
            background: var(--accent); color: #000; font-weight: 700; padding: 0 25px;
            border: none; border-radius: 8px; cursor: pointer; transition: background 0.3s ease; font-size: 14px;
        }
        .add-task-btn:hover { background: var(--accent-hover); }

        /* Task List */
        .task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .task-item {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.03); border: 1px solid transparent; padding: 15px 20px; border-radius: 8px;
            transition: all 0.2s ease;
        }
        .task-item:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
        
        .task-content { display: flex; align-items: center; gap: 15px; cursor: pointer; flex-grow: 1; }
        
        /* Custom Checkbox */
        .checkbox {
            width: 20px; height: 20px; border: 2px solid var(--text-muted); border-radius: 4px;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
        }
        .task-item.completed .checkbox { background: var(--accent); border-color: var(--accent); }
        .task-item.completed .checkbox::after { content: "✓"; color: #000; font-size: 14px; font-weight: bold; }
        
        .task-text { font-size: 15px; font-weight: 500; transition: color 0.2s ease; }
        .task-item.completed .task-text { color: var(--text-muted); text-decoration: line-through; }

        .delete-btn {
            background: transparent; color: var(--text-muted); border: none; font-size: 18px; cursor: pointer;
            opacity: 0.3; transition: all 0.2s ease; padding: 5px 10px;
        }
        .task-item:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { color: #ff4444; }
        
        #loading-text { color: var(--text-muted); font-size: 13px; font-style: italic; }

    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <nav class="sidebar">
        <div class="brand-mark"></div>
        <div class="nav-item active"><span class="nav-icon">01</span><span class="nav-label">Command Center</span></div>
        <div class="nav-item"><span class="nav-icon">02</span><span class="nav-label">Brainstorm Arena</span></div>
        <div class="nav-item"><span class="nav-icon">03</span><span class="nav-label">CSAT Engine</span></div>
        <div class="nav-item"><span class="nav-icon">04</span><span class="nav-label">Essay Forge</span></div>
        <div class="nav-item logout-btn" onclick="logout()"><span class="nav-icon">✕</span><span class="nav-label">End Session</span></div>
    </nav>

    <!-- MAIN WORKSPACE -->
    <main class="workspace">
        <header class="topbar">
            <div class="topbar-left" id="live-clock">INITIALIZING PROTOCOL...</div>
            <div class="topbar-right">
                <div class="user-profile">
                    <span id="display-name">Operative</span>
                    <div class="user-avatar" id="avatar-initial">O</div>
                </div>
            </div>
        </header>

        <div class="arena-grid">
            
            <!-- EMT 1: COMMAND CENTER -->
            <div class="command-center">
                <div class="module-header">EMT 1 // Daily Execution Protocol</div>
                
                <div class="task-input-container">
                    <input type="text" id="new-task-input" class="task-input" placeholder="Define next objective..." onkeypress="handleKeyPress(event)">
                    <button class="add-task-btn" onclick="addTask()" id="add-btn">Lock Target</button>
                </div>

                <div id="loading-text">Syncing with database...</div>
                <ul class="task-list" id="task-list">
                    <!-- Tasks will be injected here by JavaScript -->
                </ul>
            </div>

        </div>
    </main>

    <script>
        /* =========================================================
           1. SUPABASE CONNECTION (PASTE YOUR KEYS HERE!)
        ========================================================= */
        const SUPABASE_URL = 'https://qhtgcvubyaopldxmisas.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFodGdjdnVieWFvcGxkeG1pc2FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTIzNTQsImV4cCI6MjEwMjcyODM1NH0.p2IfhXkMhGNd1RkPkLLLqtIb9bcCBrVp_3WPcxn0eTg';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        /* =========================================================
           2. IDENTITY & UI SETUP
        ========================================================= */
        const userName = localStorage.getItem("currentUser") || "Operative";
        document.getElementById("display-name").innerText = userName;
        document.getElementById("avatar-initial").innerText = userName.charAt(0).toUpperCase();

        function updateClock() {
            const now = new Date();
            const options = { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            document.getElementById("live-clock").innerText = "IST SECURE LINK — " + now.toLocaleTimeString('en-IN', options);
        }
        setInterval(updateClock, 1000); updateClock();

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }

        /* =========================================================
           3. COMMAND CENTER LOGIC (CRUD OPERATIONS)
        ========================================================= */
        const taskList = document.getElementById("task-list");
        const loadingText = document.getElementById("loading-text");
        const taskInput = document.getElementById("new-task-input");

        // FETCH TASKS
        async function fetchTasks() {
            loadingText.style.display = "block";
            
            // Only select tasks that belong to the logged-in user
            const { data, error } = await db
                .from('tasks')
                .select('*')
                .eq('student_name', userName) 
                .order('created_at', { ascending: false });

            loadingText.style.display = "none";

            if (error) {
                console.error("Error fetching tasks:", error);
                return;
            }

            renderTasks(data);
        }

        // RENDER TASKS TO SCREEN
        function renderTasks(tasks) {
            taskList.innerHTML = ""; // Clear current list
            
            if(tasks.length === 0) {
                taskList.innerHTML = "<li style='color: var(--text-muted); font-size: 14px;'>No active targets. Awaiting orders.</li>";
                return;
            }

            tasks.forEach(task => {
                const li = document.createElement("li");
                li.className = `task-item ${task.is_completed ? 'completed' : ''}`;
                
                li.innerHTML = `
                    <div class="task-content" onclick="toggleTask('${task.id}', ${task.is_completed})">
                        <div class="checkbox"></div>
                        <span class="task-text">${task.task_text}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTask('${task.id}')">×</button>
                `;
                taskList.appendChild(li);
            });
        }

        // ADD NEW TASK
        async function addTask() {
            const text = taskInput.value.trim();
            if (!text) return;

            const btn = document.getElementById("add-btn");
            btn.innerText = "Locking..."; btn.disabled = true;

            const { data, error } = await db.from('tasks').insert([
                { student_name: userName, task_text: text }
            ]);

            btn.innerText = "Lock Target"; btn.disabled = false;
            taskInput.value = ""; // Clear input

            if (!error) fetchTasks(); // Refresh list
        }

        // TOGGLE COMPLETION STATUS
        async function toggleTask(id, currentStatus) {
            const { error } = await db.from('tasks')
                .update({ is_completed: !currentStatus })
                .eq('id', id);

            if (!error) fetchTasks();
        }

        // DELETE TASK
        async function deleteTask(id) {
            const { error } = await db.from('tasks')
                .delete()
                .eq('id', id);

            if (!error) fetchTasks();
        }

        // ALLOW 'ENTER' KEY TO ADD TASK
        function handleKeyPress(event) {
            if (event.key === 'Enter') addTask();
        }

        // INITIALIZE
        fetchTasks();

    </script>
</body>
</html>
