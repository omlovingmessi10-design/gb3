<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Desk — Arena</title>

    <!-- SUPABASE CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SECURITY BOUNCER -->
    <script>
        const currentUser = localStorage.getItem("currentUser");
        if (!currentUser) window.location.href = "index.html"; 
    </script>

    <style>
        /* =========================================================
           MOBILE-FIRST RESET & VARIABLES
        ========================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; }

        :root {
            --bg-dark: #0a0a0a;
            --surface: #1c1c1e; 
            --border: #2c2c2e;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --lilac: #dfc5fe; 
            --low-priority: #3a3a3c;
        }

        body { background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* =========================================================
           TOP HEADER & HAMBURGER MENU
        ========================================================= */
        .topbar {
            height: 60px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--bg-dark); z-index: 100;
        }
        
        .menu-btn {
            background: none; border: none; color: var(--text-main); font-size: 24px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; margin-left: -10px;
        }

        .user-avatar {
            width: 32px; height: 32px; border-radius: 50%; background: var(--surface);
            display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
        }

        /* =========================================================
           OFF-CANVAS SIDEBAR
        ========================================================= */
        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(3px);
        }
        .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

        .sidebar {
            position: fixed; top: 0; left: 0; bottom: 0; width: 250px; background: #000;
            border-right: 1px solid var(--border); z-index: 201;
            transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; padding-top: 20px;
        }
        .sidebar.active { transform: translateX(0); }

        .sidebar-header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px 30px; }
        .brand-mark { width: 30px; height: 30px; background: var(--text-main); border-radius: 50%; }
        .close-sidebar { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }

        .nav-item { display: flex; align-items: center; padding: 16px 20px; color: var(--text-muted); text-decoration: none; font-size: 15px; font-weight: 500; }
        .nav-item.active { color: var(--text-main); background: var(--surface); border-left: 3px solid var(--lilac); }
        .nav-icon { min-width: 30px; font-weight: 700; }
        .logout-btn { margin-top: auto; border-left: 3px solid #ff453a; margin-bottom: 20px; }

        /* =========================================================
           MAIN ARENA (TARGETS LIST)
        ========================================================= */
        .arena { flex-grow: 1; padding: 25px 20px; overflow-y: auto; padding-bottom: 100px; }
        
        .page-title { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 4px; }
        .page-date { font-size: 14px; color: var(--text-muted); font-weight: 500; margin-bottom: 25px; }

        .task-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        
        .task-card {
            background: var(--surface); border-radius: 16px; padding: 16px;
            display: flex; flex-direction: column; gap: 12px; position: relative;
        }
        
        /* High Priority Lilac Styling */
        .task-card.priority-high:not(.completed) { background: var(--lilac); color: #000; }
        .task-card.priority-high:not(.completed) .task-text { color: #000; }
        .task-card.priority-high:not(.completed) .checkbox { border-color: #000; }
        .task-card.priority-high:not(.completed) .target-date { color: rgba(0,0,0,0.6); }

        .task-card.completed { opacity: 0.5; }

        .card-body { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
        
        .checkbox {
            width: 22px; height: 22px; border: 2px solid var(--text-muted); border-radius: 6px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;
        }
        .task-card.completed .checkbox { background: var(--lilac); border-color: var(--lilac); }
        .task-card.completed .checkbox::after { content: "✓"; color: #000; font-size: 14px; font-weight: bold; }
        
        .task-text { font-size: 16px; font-weight: 500; line-height: 1.4; }
        .task-card.completed .task-text { text-decoration: line-through; color: var(--text-muted); }

        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-left: 34px; }
        .target-date { font-size: 12px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 4px;}
        
        .delete-btn { background: transparent; border: none; font-size: 18px; color: var(--text-muted); padding: 5px; opacity: 0.5; cursor: pointer; }

        /* =========================================================
           FLOATING ACTION BUTTON (+) & MODAL
        ========================================================= */
        .fab {
            position: fixed; bottom: 30px; right: 25px; width: 60px; height: 60px;
            background: var(--lilac); color: #000; border: none; border-radius: 50%;
            font-size: 32px; font-weight: 300; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 24px rgba(223, 197, 254, 0.3); z-index: 100; cursor: pointer;
        }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 300;
            display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: var(--surface); width: 100%; border-radius: 24px 24px 0 0;
            padding: 24px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 18px; font-weight: 600; }
        .close-modal { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }

        .field-group { margin-bottom: 20px; }
        .field-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;}
        
        .target-input {
            width: 100%; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 12px;
            padding: 16px; color: var(--text-main); font-size: 16px; outline: none;
        }
        
        /* Native Date Picker Styling */
        .date-input {
            width: 100%; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 12px;
            padding: 14px 16px; color: var(--text-main); font-size: 15px; outline: none; color-scheme: dark;
        }

        /* Priority Toggle */
        .priority-toggle { display: flex; gap: 10px; }
        .priority-btn {
            flex: 1; padding: 14px; border: 1px solid var(--border); border-radius: 12px;
            background: var(--bg-dark); color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease;
        }
        .priority-btn.active.high { background: var(--lilac); color: #000; border-color: var(--lilac); }
        .priority-btn.active.low { background: var(--text-main); color: #000; border-color: var(--text-main); }

        .save-btn {
            width: 100%; background: var(--lilac); color: #000; border: none; border-radius: 16px;
            padding: 18px; font-size: 16px; font-weight: 700; margin-top: 10px; cursor: pointer;
        }

        #loading-text { font-size: 13px; color: var(--text-muted); text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header class="topbar">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="user-avatar" id="avatar-initial">O</div>
    </header>

    <!-- SIDEBAR & OVERLAY -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand-mark"></div>
            <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
        </div>
        <div class="nav-item active"><span class="nav-icon">≡</span>Command Center</div>
        <div class="nav-item"><span class="nav-icon">◱</span>Brainstorm Arena</div>
        <div class="nav-item"><span class="nav-icon">◳</span>CSAT Engine</div>
        <div class="nav-item logout-btn" onclick="logout()"><span class="nav-icon">✕</span>End Session</div>
    </nav>

    <!-- MAIN ARENA -->
    <main class="arena">
        <h1 class="page-title">TARGETS</h1>
        <p class="page-date" id="display-date">Loading date...</p>

        <div id="loading-text">Syncing data...</div>
        <ul class="task-list" id="task-list">
            <!-- Targets inject here -->
        </ul>
    </main>

    <!-- FLOATING ACTION BUTTON -->
    <button class="fab" onclick="openModal()">+</button>

    <!-- NEW TARGET MODAL -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>New Target</h3>
                <button class="close-modal" onclick="closeModal()">✕</button>
            </div>

            <div class="field-group">
                <input type="text" id="target-name" class="target-input" placeholder="e.g., Complete CSAT PYQs">
            </div>

            <div class="field-group">
                <label class="field-label">Priority</label>
                <div class="priority-toggle">
                    <button class="priority-btn active high" id="btn-high" onclick="setPriority('High')">High</button>
                    <button class="priority-btn" id="btn-low" onclick="setPriority('Low')">Low</button>
                </div>
            </div>

            <div class="field-group">
                <label class="field-label">Date</label>
                <input type="date" id="target-date" class="date-input">
            </div>

            <button class="save-btn" id="save-btn" onclick="saveTarget()">Lock Target</button>
        </div>
    </div>

    <script>
        /* =========================================================
           1. SUPABASE CONNECTION (PASTE YOUR KEYS HERE!)
        ========================================================= */
        const SUPABASE_URL = 'https://qhtgcvubyaopldxmisas.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFodGdjdnVieWFvcGxkeG1pc2FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTIzNTQsImV4cCI6MjEwMjcyODM1NH0.p2IfhXkMhGNd1RkPkLLLqtIb9bcCBrVp_3WPcxn0eTg';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        /* =========================================================
           2. UI INITIALIZATION & SIDEBAR
        ========================================================= */
        const userName = localStorage.getItem("currentUser") || "Operative";
        document.getElementById("avatar-initial").innerText = userName.charAt(0).toUpperCase();

        function setTodayDate() {
            const today = new Date();
            const options = { timeZone: 'Asia/Kolkata', weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById("display-date").innerText = today.toLocaleDateString('en-IN', options);
        }
        setTodayDate();

        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("active");
            document.getElementById("sidebar-overlay").classList.toggle("active");
        }

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }

        /* =========================================================
           3. MODAL LOGIC (ADD TARGET)
        ========================================================= */
        let currentPriority = "High";

        function openModal() {
            document.getElementById("modal-overlay").classList.add("active");
            document.getElementById("target-name").value = "";
            setPriority("High");
            
            // Set default date to today in YYYY-MM-DD format for the input
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById("target-date").value = `${yyyy}-${mm}-${dd}`;
        }

        function closeModal() {
            document.getElementById("modal-overlay").classList.remove("active");
        }

        function setPriority(level) {
            currentPriority = level;
            const btnHigh = document.getElementById("btn-high");
            const btnLow = document.getElementById("btn-low");
            
            if (level === "High") {
                btnHigh.classList.add("active", "high");
                btnLow.classList.remove("active", "low");
            } else {
                btnLow.classList.add("active", "low");
                btnHigh.classList.remove("active", "high");
            }
        }

        /* =========================================================
           4. DATABASE CRUD OPERATIONS
        ========================================================= */
        const taskList = document.getElementById("task-list");
        const loadingText = document.getElementById("loading-text");

        async function fetchTasks() {
            loadingText.style.display = "block";
            
            const { data, error } = await db
                .from('tasks')
                .select('*')
                .eq('student_name', userName) 
                .order('is_completed', { ascending: true }) // Active first
                .order('created_at', { ascending: false });

            loadingText.style.display = "none";
            if (!error) renderTasks(data);
        }

        function formatDisplayDate(dateString) {
            if (!dateString) return "";
            const date = new Date(dateString);
            return date.toLocaleDateString('en-IN', { month: 'short', day: 'numeric' });
        }

        function renderTasks(tasks) {
            taskList.innerHTML = ""; 
            if(tasks.length === 0) return;

            tasks.forEach(task => {
                const li = document.createElement("li");
                
                // Determine styling based on priority and completion
                const priorityClass = task.priority === "High" ? "priority-high" : "priority-low";
                li.className = `task-card ${task.is_completed ? 'completed' : ''} ${priorityClass}`;
                
                const formattedDate = formatDisplayDate(task.target_date);

                li.innerHTML = `
                    <div class="card-body" onclick="toggleTask('${task.id}', ${task.is_completed})">
                        <div class="checkbox"></div>
                        <span class="task-text">${task.task_text}</span>
                    </div>
                    <div class="card-footer">
                        <span class="target-date">📅 ${formattedDate || "No Date"}</span>
                        <button class="delete-btn" onclick="deleteTask('${task.id}')">✕</button>
                    </div>
                `;
                taskList.appendChild(li);
            });
        }

        async function saveTarget() {
            const text = document.getElementById("target-name").value.trim();
            const dateVal = document.getElementById("target-date").value;
            if (!text) return;

            const btn = document.getElementById("save-btn");
            btn.innerText = "Saving..."; btn.disabled = true;

            const { error } = await db.from('tasks').insert([{ 
                student_name: userName, 
                task_text: text,
                priority: currentPriority,
                target_date: dateVal || null
            }]);

            btn.innerText = "Lock Target"; btn.disabled = false;
            
            if (!error) {
                closeModal();
                fetchTasks();
            }
        }

        async function toggleTask(id, currentStatus) {
            const { error } = await db.from('tasks').update({ is_completed: !currentStatus }).eq('id', id);
            if (!error) fetchTasks();
        }

        async function deleteTask(id) {
            const { error } = await db.from('tasks').delete().eq('id', id);
            if (!error) fetchTasks();
        }

        // INITIALIZE
        fetchTasks();
    </script>
</body>
</html>
