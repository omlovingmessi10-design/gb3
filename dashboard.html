    <style>
        /* =========================================================
           MOBILE-FIRST RESET & VARIABLES
        ========================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; }

        :root {
            --bg-dark: #0a0a0a;
            --surface: #1c1c1e; 
            --border: #2c2c2e;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --lilac: #dfc5fe; 
            --low-priority: #3a3a3c;
        }

        body { background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* =========================================================
           TOP HEADER & HAMBURGER MENU
        ========================================================= */
        .topbar {
            height: 60px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--bg-dark); z-index: 100;
        }
        
        .menu-btn {
            background: none; border: none; color: var(--text-main); font-size: 24px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; margin-left: -10px;
        }

        .user-avatar {
            width: 32px; height: 32px; border-radius: 50%; background: var(--surface);
            display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
        }

        /* =========================================================
           OFF-CANVAS SIDEBAR
        ========================================================= */
        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(3px);
        }
        .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

        .sidebar {
            position: fixed; top: 0; left: 0; bottom: 0; width: 250px; background: #000;
            border-right: 1px solid var(--border); z-index: 201;
            transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; padding-top: 20px;
        }
        .sidebar.active { transform: translateX(0); }

        .sidebar-header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px 30px; }
        .brand-mark { width: 30px; height: 30px; background: var(--text-main); border-radius: 50%; }
        .close-sidebar { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }

        .nav-item { display: flex; align-items: center; padding: 16px 20px; color: var(--text-muted); text-decoration: none; font-size: 15px; font-weight: 500; }
        .nav-item.active { color: var(--text-main); background: var(--surface); border-left: 3px solid var(--lilac); }
        .nav-icon { min-width: 30px; font-weight: 700; }
        .logout-btn { margin-top: auto; border-left: 3px solid #ff453a; margin-bottom: 20px; }

        /* =========================================================
           MAIN ARENA (TARGETS LIST)
        ========================================================= */
        .arena { flex-grow: 1; padding: 25px 20px; overflow-y: auto; padding-bottom: 100px; }
        
        .page-title { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 4px; }
        .page-date { font-size: 14px; color: var(--text-muted); font-weight: 500; margin-bottom: 25px; }

        .task-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        
        .task-card {
            background: var(--surface); border-radius: 16px; padding: 16px;
            display: flex; flex-direction: column; gap: 12px; position: relative;
        }
        
        /* High Priority Lilac Styling */
        .task-card.priority-high:not(.completed) { background: var(--lilac); color: #000; }
        .task-card.priority-high:not(.completed) .task-text { color: #000; }
        .task-card.priority-high:not(.completed) .checkbox { border-color: #000; }
        .task-card.priority-high:not(.completed) .target-date { color: rgba(0,0,0,0.6); }

        .task-card.completed { opacity: 0.5; }

        .card-body { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
        
        .checkbox {
            width: 22px; height: 22px; border: 2px solid var(--text-muted); border-radius: 6px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;
        }
        .task-card.completed .checkbox { background: var(--lilac); border-color: var(--lilac); }
        .task-card.completed .checkbox::after { content: "✓"; color: #000; font-size: 14px; font-weight: bold; }
        
        .task-text { font-size: 16px; font-weight: 500; line-height: 1.4; }
        .task-card.completed .task-text { text-decoration: line-through; color: var(--text-muted); }

        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-left: 34px; }
        .target-date { font-size: 12px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 4px;}
        
        .delete-btn { background: transparent; border: none; font-size: 18px; color: var(--text-muted); padding: 5px; opacity: 0.5; cursor: pointer; }

        /* =========================================================
           FLOATING ACTION BUTTON (+) & MODAL
        ========================================================= */
        .fab {
            position: fixed; bottom: 30px; right: 25px; width: 60px; height: 60px;
            background: var(--lilac); color: #000; border: none; border-radius: 50%;
            font-size: 32px; font-weight: 300; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 24px rgba(223, 197, 254, 0.3); z-index: 100; cursor: pointer;
        }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 300;
            display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: var(--surface); width: 100%; border-radius: 24px 24px 0 0;
            padding: 24px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 18px; font-weight: 600; }
        .close-modal { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }

        .field-group { margin-bottom: 20px; }
        .field-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;}
        
        .target-input {
            width: 100%; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 12px;
            padding: 16px; color: var(--text-main); font-size: 16px; outline: none;
        }
        
        /* Native Date Picker Styling */
        .date-input {
            width: 100%; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 12px;
            padding: 14px 16px; color: var(--text-main); font-size: 15px; outline: none; color-scheme: dark;
        }

        /* Priority Toggle */
        .priority-toggle { display: flex; gap: 10px; }
        .priority-btn {
            flex: 1; padding: 14px; border: 1px solid var(--border); border-radius: 12px;
            background: var(--bg-dark); color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease;
        }
        .priority-btn.active.high { background: var(--lilac); color: #000; border-color: var(--lilac); }
        .priority-btn.active.low { background: var(--text-main); color: #000; border-color: var(--text-main); }

        .save-btn {
            width: 100%; background: var(--lilac); color: #000; border: none; border-radius: 16px;
            padding: 18px; font-size: 16px; font-weight: 700; margin-top: 10px; cursor: pointer;
        }

        #loading-text { font-size: 13px; color: var(--text-muted); text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

            <div class="field-group">
                <label class="field-label">Date</label>
                <input type="date" id="target-date" class="date-input">
            </div>

            <button class="save-btn" id="save-btn" onclick="saveTarget()">Lock Target</button>

<style>
:root{
  --bg:#e7e4d6;
  --surface:#fbf9f1;
  --surface-2:#f2efe2;
  --ink:#1b2a44;
  --ink-soft:#5a6478;
  --ink-faint:#8a8f7f;
  --rule:#cac3a9;
  --rule-strong:#b3ab8d;
  --seal:#9c2b2b;
  --seal-soft:#e9d3ce;
  --brass:#a9781f;
  --brass-soft:#ecdfc0;
  --sage:#4b6b4c;
  --sage-soft:#d9e3d3;
  --navy-bright:#2e4a82;
  --panel:#1b2a44;
  --radius-s:6px;
  --radius-m:12px;
  --radius-l:20px;
  --shadow-card:0 1px 2px rgba(27,42,68,.06), 0 8px 24px -12px rgba(27,42,68,.18);
  --font-display:'Fraunces', serif;
  --font-body:'IBM Plex Sans', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
html.dark{
  --bg:#10162a;
  --surface:#1a2338;
  --surface-2:#212b44;
  --ink:#edeff5;
  --ink-soft:#a6adc4;
  --ink-faint:#767d99;
  --rule:#323e5c;
  --rule-strong:#454f74;
  --seal:#e2837b;
  --seal-soft:#3a2530;
  --brass:#d9b768;
  --brass-soft:#3a331f;
  --sage:#93c398;
  --sage-soft:#213326;
  --navy-bright:#8fadf0;
}
html.dark body::before{opacity:.18;}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(27,42,68,.05) 1px, transparent 0);
  background-size:22px 22px;
  pointer-events:none;
  z-index:0;
  opacity:.5;
}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
:focus-visible{outline:2px solid var(--navy-bright); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}

/* ===== layout shell ===== */
.shell{
  position:relative; z-index:1;
  min-height:100vh;
}

/* sidebar drawer — toggled by the three-bar control, overlay on phones, pushes content on wide screens */
.rail{
  position:fixed; top:0; left:0; height:100vh; width:250px;
  display:flex; flex-direction:column; justify-content:space-between;
  background:var(--panel); color:#eee7d3;
  padding:20px 16px 18px;
  z-index:70;
  transform:translateX(-100%);
  transition:transform .25s ease;
}
.rail.open{transform:translateX(0);}
.rail-top{display:flex; flex-direction:column; align-items:stretch; gap:26px;}
.rail-head{display:flex; align-items:center; justify-content:space-between;}
.rail-mark{
  font-family:var(--font-display); font-weight:680; font-size:19px; letter-spacing:.3px; line-height:1.1;
}
.rail-mark span.tag{font-family:var(--font-mono); font-size:9.5px; color:#c8cbd8; letter-spacing:.08em; display:block; margin-top:2px; font-weight:400;}
.rail-close{
  width:34px; height:34px; border-radius:8px; border:1px solid #ffffff2a; background:#ffffff10;
  display:flex; align-items:center; justify-content:center; color:#eee7d3; flex-shrink:0;
}
.rail-close svg{width:17px; height:17px;}
.rail-close:hover{background:#ffffff1c;}
.rail-tabs{display:flex; flex-direction:column; gap:3px; width:100%;}
.rail-tab{
  display:flex; flex-direction:row; align-items:center; gap:12px;
  padding:11px 12px; width:100%; text-align:left;
  background:transparent; border:none; border-radius:var(--radius-s); color:#c8cbd8;
  font-size:13.5px; font-weight:500;
  position:relative;
  transition:background .15s ease, color .15s ease;
}
.rail-tab svg{width:18px; height:18px; flex-shrink:0;}
.rail-tab:hover{background:#ffffff10; color:#eee7d3;}
.rail-tab.active{color:#fff; background:#ffffff14;}
.rail-tab.active::before{content:""; position:absolute; left:-16px; top:6px; bottom:6px; width:3px; background:var(--seal); border-radius:2px;}
.rail-tab.danger{color:#f0b3ab;}
.rail-tab.danger:hover{background:#9c2b2b22; color:#ffcfc6;}
.rail-divider{height:1px; background:#ffffff1c; margin:8px 4px;}
.rail-bottom{display:flex; align-items:center; gap:10px; width:100%; background:none; border:none; padding:10px 8px; border-radius:var(--radius-s); text-align:left;}
.rail-bottom:hover{background:#ffffff10;}
.rail-avatar{width:34px; height:34px; border-radius:50%; object-fit:cover; border:1.5px solid #eee7d366; flex-shrink:0;}
.rail-bottom-text{display:flex; flex-direction:column; line-height:1.25;}
.rail-bottom-text b{font-size:12.5px; color:#eee7d3; font-weight:600;}
.rail-bottom-text span{font-size:10.5px; color:#a8ade0;}

/* backdrop only needed while the drawer floats over narrow layouts */
.backdrop{
  position:fixed; inset:0; background:#14213d9c; z-index:65;
  opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.backdrop.show{opacity:1; pointer-events:auto;}
@media (min-width:880px){ .backdrop{display:none;} }

.main{
  min-width:0;
  padding:20px 16px 60px;
  transition:margin-left .25s ease;
}
@media (min-width:600px){ .main{padding:28px 32px 60px;} }
@media (min-width:880px){ .main{padding:32px 40px 60px;} }
@media (min-width:1220px){ .main{padding:40px 56px 70px;} }
@media (min-width:880px){ .main.pushed{margin-left:250px;} }
.main-inner{max-width:1180px; margin:0 auto;}

/* ===== header ===== */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  gap:14px; margin-bottom:22px;
}
.topbar-left{display:flex; align-items:center; gap:12px; min-width:0;}
.profile{display:flex; align-items:center; gap:12px; background:none; border:none; text-align:left; min-width:0; border-radius:var(--radius-s); padding:4px; margin:-4px;}
.profile:hover{background:var(--surface-2);}
.profile img{width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid var(--surface); box-shadow:0 0 0 2px var(--rule-strong);}
.profile-name{font-weight:600; font-size:15px; line-height:1.2;}
.profile-sub{font-size:12px; color:var(--ink-soft); font-family:var(--font-mono);}
.top-actions{display:flex; align-items:center; gap:8px;}
.icon-btn{
  width:40px; height:40px; border-radius:50%; border:1px solid var(--rule);
  background:var(--surface); display:flex; align-items:center; justify-content:center;
  position:relative; color:var(--ink);
}
.icon-btn svg{width:17px; height:17px;}
.icon-btn .dot{position:absolute; top:9px; right:10px; width:6px; height:6px; border-radius:50%; background:var(--seal);}

/* ===== daybook hero ===== */
.daybook{
  background:var(--surface);
  border:1px solid var(--rule);
  border-radius:var(--radius-l);
  box-shadow:var(--shadow-card);
  padding:22px 20px 20px;
  position:relative;
  overflow:hidden;
  margin-bottom:26px;
}
.daybook::before{
  content:""; position:absolute; inset:0;
  background-image:repeating-linear-gradient(to bottom, transparent 0 37px, var(--rule) 37px 38px);
  opacity:.35; pointer-events:none;
}
@media (max-width:599px){
  .daybook::before{ content:none; }
}
.daybook-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:14px;
  position:relative; z-index:1; flex-wrap:wrap; margin-bottom:18px;
}
.eyebrow{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-soft); margin-bottom:6px; display:block;
}
.daybook h1{
  font-family:var(--font-display); font-weight:600; font-size:clamp(24px,4vw,32px);
  letter-spacing:-.01em;
}

.tab-strip{
  display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:16px;
  position:relative; z-index:1;
  scrollbar-width:none;
}
.tab-strip::-webkit-scrollbar{display:none;}
.tab-chip{
  flex-shrink:0; padding:8px 14px; border-radius:100px; border:1px solid var(--rule);
  background:var(--surface-2); font-size:13px; font-weight:500; color:var(--ink-soft);
  display:flex; align-items:center; gap:6px;
}
.tab-chip .n{font-family:var(--font-mono); font-size:11px; opacity:.7;}
.tab-chip.active{background:var(--panel); color:#eee7d3; border-color:var(--panel);}

.daybook-toolbar{
  display:flex; align-items:center; justify-content:flex-end; gap:10px;
  margin-bottom:14px; position:relative; z-index:1;
}
.add-btn{
  display:flex; align-items:center; gap:6px;
  background:var(--panel); color:#eee7d3; border:none; border-radius:var(--radius-s);
  padding:9px 14px; font-size:13px; font-weight:600;
}
.add-btn svg{width:15px; height:15px;}
.add-btn:hover{background:var(--navy-bright);}

.task-list{position:relative; z-index:1; display:flex; flex-direction:column;}
.task{
  display:flex; align-items:center; gap:12px;
  min-height:38px; padding:8px 6px;
  border-bottom:1px dashed var(--rule);
}
.task:last-child{border-bottom:none;}
.check{
  width:20px; height:20px; border-radius:50%; border:1.6px solid var(--ink-soft);
  flex-shrink:0; background:none; position:relative;
}
.check svg{position:absolute; inset:0; margin:auto; width:11px; height:11px; opacity:0; color:var(--sage);}
.task.done .check{border-color:var(--sage); background:var(--sage-soft);}
.task.done .check svg{opacity:1;}
.task-body{flex:1; min-width:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.task-title{
  font-size:14.5px; font-weight:500; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; text-overflow:ellipsis; word-break:break-word;
}
.task.done .task-title{text-decoration:line-through; color:var(--ink-faint);}
.task-meta{display:flex; align-items:center; gap:8px; flex-wrap:nowrap;}
.task-actions{display:flex; align-items:center; gap:4px; flex-shrink:0;}
.menu-wrap{position:relative;}
.dots{
  width:30px; height:30px; border-radius:50%; border:none; background:transparent;
  display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
}
.dots:hover{background:var(--surface-2);}
.dots svg{width:16px; height:16px;}
.menu{
  position:absolute; right:0; top:34px; min-width:170px; background:var(--surface);
  border:1px solid var(--rule); border-radius:var(--radius-s); box-shadow:var(--shadow-card);
  z-index:20; overflow:hidden; display:none;
}
.menu.open{display:block;}
.font-menu{top:46px; min-width:216px; max-height:320px; overflow-y:auto;}
.menu button{
  display:block; width:100%; text-align:left; padding:10px 14px; font-size:13px;
  background:none; border:none; color:var(--ink);
}
.menu button:hover{background:var(--surface-2);}
.menu button.danger{color:var(--seal);}
.empty-state{
  padding:26px 10px; text-align:center; color:var(--ink-soft); font-size:13.5px; position:relative; z-index:1;
}

/* CA add-task extra field */
.ca-panel{
  background:var(--brass-soft); border:1px dashed var(--brass); border-radius:var(--radius-m);
  padding:12px 14px; margin-bottom:14px; font-size:12.5px; color:#5c440f; position:relative; z-index:1;
  display:none;
}
.ca-panel.show{display:block;}

/* CSAT panel */
.csat-panel{position:relative; z-index:1; display:none; flex-direction:column; gap:10px; margin-bottom:16px;}
.csat-panel.show{display:flex;}
.csat-card{
  border:1px solid var(--rule); border-radius:var(--radius-m); padding:12px 14px;
  background:var(--surface-2); display:flex; flex-direction:column; gap:8px;
  transition:transform .15s ease, box-shadow .15s ease;
}
.csat-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-card);}
.csat-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
.csat-top strong{font-size:13.5px;}
.csat-top span{font-family:var(--font-mono); font-size:11px; color:var(--ink-soft);}
.bar{height:6px; border-radius:100px; background:var(--rule); overflow:hidden;}
.bar i{display:block; height:100%; background:var(--navy-bright); border-radius:100px;}
.csat-hint{font-size:11.5px; color:var(--ink-soft); max-height:0; overflow:hidden; transition:max-height .2s ease;}
.csat-card:hover .csat-hint{max-height:40px;}

/* ===== modules grid ===== */
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin:8px 0 14px; gap:10px;}
.section-head h2{font-family:var(--font-display); font-weight:600; font-size:20px;}
.section-head span{font-size:12.5px; color:var(--ink-soft);}
.modules{
  display:grid; grid-template-columns:1fr; gap:14px; margin-bottom:30px;
}
@media (min-width:640px){ .modules{grid-template-columns:1fr 1fr;} }
@media (min-width:1220px){ .modules{grid-template-columns:1fr 1fr 1fr;} }
.module-card{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius-m);
  padding:16px 16px 15px; display:flex; flex-direction:column; gap:10px; text-align:left;
  box-shadow:var(--shadow-card); transition:transform .15s ease, border-color .15s ease;
}
.module-card:hover{transform:translateY(-3px); border-color:var(--ink-soft);}
.module-top{display:flex; align-items:center; justify-content:space-between;}
.module-icon{
  width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); border:1px solid var(--rule); color:var(--ink);
}
.module-icon svg{width:17px; height:17px;}
.module-id{font-family:var(--font-mono); font-size:10px; color:var(--ink-faint);}
.module-card h3{font-size:15.5px; font-weight:600; line-height:1.3;}
.module-card p{font-size:12.5px; color:var(--ink-soft); line-height:1.45;}
.module-open{
  align-self:flex-start; font-size:12px; font-weight:600; color:var(--navy-bright);
  display:flex; align-items:center; gap:4px; margin-top:2px;
}
.module-open svg{width:12px; height:12px;}

/* ===== Obsidian-style note graph (CA Map) — force-directed, Doctor-Strange glow ===== */
.graph-wrap{
  background:#0c1220;
  border:1px solid var(--rule); border-radius:var(--radius-m); padding:6px; margin-top:4px;
  position:relative; overflow:hidden;
}
html:not(.dark) .graph-wrap{background:#131b2e;}
.graph-svg{width:100%; height:420px; display:block; touch-action:none; cursor:grab;}
.graph-svg.dragging{cursor:grabbing;}
.g-edge{stroke:url(#gEdgeGrad); stroke-width:.5; opacity:.55; transition:opacity .15s ease, stroke-width .15s ease;}
.g-edge.active{opacity:1; stroke-width:1.1;}
.g-node{cursor:grab;}
.g-node.dragging{cursor:grabbing;}
.g-dot{stroke-width:1; transition:r .15s ease, filter .15s ease;}
.g-dot.brass{stroke:#ffb648; fill:#3a2a0f;}
.g-dot.navy{stroke:#7fa6ff; fill:#111a33;}
.g-dot.sage{stroke:#8fe0a0; fill:#0f2417;}
.g-dot.seal{stroke:#ff8a6b; fill:#301410;}
.g-node:hover .g-dot, .g-node.active .g-dot{r:3.6; filter:drop-shadow(0 0 3px #ffb04880);}
.g-node.dim{opacity:.16;}
.g-label{font-size:2.6px; fill:#cfd3e6; font-family:var(--font-mono); text-anchor:middle; pointer-events:none;}
.g-node:hover .g-label, .g-node.active .g-label{fill:#ffd9a8; font-weight:600;}
.graph-caption{font-size:11.5px; color:var(--ink-soft); padding:8px 4px 2px; text-align:center;}
.graph-legend{display:flex; flex-wrap:wrap; gap:8px; padding:8px 4px 2px;}
.graph-legend span{font-size:10.5px; font-family:var(--font-mono); color:var(--ink-soft); display:flex; align-items:center; gap:5px;}
.graph-legend i{width:8px; height:8px; border-radius:50%; display:inline-block;}
.graph-controls{position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; gap:6px; z-index:2;}
.graph-zoom-btn{width:30px; height:30px; border-radius:8px; border:1px solid #ffffff26; background:#ffffff14; color:#eee7d3; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600;}
.graph-zoom-btn:hover{background:#ffffff26;}

/* ===== theme multi-connect picker (CA add-task step 2) ===== */
.theme-grid{display:grid; grid-template-columns:1fr 1fr; gap:7px; max-height:260px; overflow-y:auto; padding:2px;}
@media (min-width:520px){ .theme-grid{grid-template-columns:1fr 1fr 1fr;} }
.theme-chip{
  display:flex; align-items:center; gap:7px; padding:8px 9px; border-radius:var(--radius-s);
  border:1.4px solid var(--rule); background:var(--surface-2); font-size:11.5px; color:var(--ink-soft);
  text-align:left; line-height:1.25;
}
.theme-chip input{width:14px; height:14px; accent-color:var(--brass); flex-shrink:0;}
.theme-chip.sel{border-color:var(--brass); color:var(--ink); background:var(--brass-soft); font-weight:600;}
.theme-count{font-size:11.5px; color:var(--ink-soft); margin-top:8px;}

/* ===== charts (Prelims Test Analysis) ===== */
.chart-svg{width:100%; height:220px; display:block;}
.chart-grid{stroke:var(--rule); stroke-width:.6;}
.chart-axis-label{font-family:var(--font-mono); font-size:8.5px; fill:var(--ink-faint);}
.chart-line{stroke-linejoin:round; stroke-linecap:round;}
.chart-legend{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
.legend-chip{display:flex; align-items:center; gap:6px; font-size:11px; padding:4px 9px; border-radius:100px; border:1px solid var(--rule); background:var(--surface); cursor:pointer; user-select:none; transition:opacity .15s ease;}
.legend-chip.off{opacity:.32;}
.legend-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}

/* ===== pie charts (Time Log) ===== */
.pie-row{display:grid; grid-template-columns:1fr; gap:16px; margin-top:6px;}
@media (min-width:640px){ .pie-row{grid-template-columns:1fr 1fr 1fr;} }
.pie-card{border:1px solid var(--rule); border-radius:var(--radius-m); padding:14px; background:var(--surface); text-align:center;}
.pie-card h5{font-size:12.5px; font-weight:600; margin-bottom:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; font-family:var(--font-mono);}
.pie-svg{width:120px; height:120px; margin:0 auto 8px;}
.pie-stat{font-size:12px; color:var(--ink-soft);}
.pie-stat b{color:var(--ink);}

/* ===== Prelims Test Analysis ===== */
.pta-section{border:1px solid var(--rule); border-radius:var(--radius-m); padding:16px; margin-bottom:16px; background:var(--surface-2);}
.pta-section h4{font-family:var(--font-display); font-size:16px; margin-bottom:12px; font-weight:600;}
.pta-row{display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:12px;}
@media (min-width:640px){ .pta-row{grid-template-columns:1fr 1fr;} }
.round-block{border:1px dashed var(--rule-strong); border-radius:var(--radius-s); padding:10px 12px; margin-bottom:8px; background:var(--surface);}
.round-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:4px;}
.round-head b{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft);}
.round-result{font-family:var(--font-mono); font-size:12px; color:var(--ink);}
.round-result .acc.low, .sacc.low{color:var(--seal); font-weight:700;}
.mini-inputs{display:flex; gap:8px;}
.mini-inputs input{width:100%; padding:8px 10px; border:1px solid var(--rule); border-radius:var(--radius-s); background:var(--surface-2); font-family:inherit; font-size:13px; color:var(--ink);}
.subject-toggle-btn{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--navy-bright); background:none; border:none; padding:6px 0;}
.subject-toggle-btn svg{transition:transform .15s ease;}
.subject-toggle-btn.open svg{transform:rotate(90deg);}
.subject-panel{display:none; margin-top:8px; border-top:1px dashed var(--rule-strong); padding-top:10px;}
.subject-panel.show{display:block;}
.subject-line{display:grid; grid-template-columns:1.6fr .8fr .8fr .8fr .7fr; gap:6px; align-items:center; padding:6px 0; border-bottom:1px solid var(--rule); font-size:12px;}
.subject-line input{width:100%; padding:6px 7px; border:1px solid var(--rule); border-radius:6px; background:var(--surface); font-family:inherit; font-size:12px; color:var(--ink);}
.subject-line .sname{font-weight:500;}
.multiselect{position:relative;}
.ms-btn{width:100%; text-align:left; padding:10px 12px; border:1px solid var(--rule); border-radius:var(--radius-s); background:var(--surface); font-size:13px; display:flex; justify-content:space-between; align-items:center; color:var(--ink); font-family:inherit;}
.ms-panel{position:absolute; top:44px; left:0; right:0; background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius-s); box-shadow:var(--shadow-card); z-index:15; max-height:230px; overflow-y:auto; display:none;}
.ms-panel.open{display:block;}
.ms-item{display:flex; align-items:center; gap:9px; padding:9px 12px; font-size:13px; border-bottom:1px solid var(--rule); cursor:pointer;}
.ms-item:last-child{border-bottom:none;}
.ms-item:hover{background:var(--surface-2);}
.ms-item input{width:15px; height:15px; accent-color:var(--navy-bright); flex-shrink:0;}
.test-card{border:1px solid var(--rule); border-radius:var(--radius-m); padding:13px 14px; margin-bottom:10px; background:var(--surface);}
.test-card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
.test-card-head h5{font-size:14px; font-weight:600;}
.test-card-meta{font-size:11px; color:var(--ink-soft); font-family:var(--font-mono); margin-top:3px;}
.marks-pill{font-family:var(--font-mono); font-size:12px; font-weight:600; padding:5px 10px; border-radius:100px; background:var(--surface-2); border:1px solid var(--rule); white-space:nowrap; flex-shrink:0;}
.subject-chips{display:flex; flex-wrap:wrap; gap:6px;}
.subj-chip{font-size:10.5px; padding:3px 8px; border-radius:100px; border:1px solid var(--rule); background:var(--surface-2); color:var(--ink-soft); font-family:var(--font-mono);}
.subj-chip.low{color:#fff; background:var(--seal); border-color:var(--seal);}
.subj-chip.high{color:#fff; background:var(--sage); border-color:var(--sage);}

/* ===== Planning Ahead ===== */
.plan-entry{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px dashed var(--rule-strong);}
.plan-entry:last-child{border-bottom:none;}
.plan-date{
  font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--navy-bright);
  background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--radius-s);
  padding:6px 8px; text-align:center; min-width:52px; flex-shrink:0; line-height:1.2;
}
.plan-date small{display:block; font-size:9px; color:var(--ink-soft); font-weight:400;}
.plan-entry-title{font-size:13.5px; font-weight:500; flex:1;}
.plan-entry-cat{font-size:10.5px; color:var(--ink-faint); font-family:var(--font-mono);}
.today-badge{font-size:9.5px; font-weight:700; color:var(--seal); background:var(--seal-soft); border-radius:100px; padding:2px 7px; text-transform:uppercase; letter-spacing:.04em; font-family:var(--font-mono);}

/* ===== modal ===== */
.overlay{
  position:fixed; inset:0; background:#14213dcc; z-index:60;
  display:none; align-items:flex-end; justify-content:center; padding:0;
}
.overlay.open{display:flex;}
@media (min-width:640px){ .overlay{align-items:center; padding:20px;} }
.modal{
  background:var(--surface); width:100%; max-width:460px; max-height:88vh; overflow-y:auto;
  border-radius:20px 20px 0 0; padding:22px 20px 26px; position:relative;
  animation:slideUp .22s ease;
}
@media (min-width:640px){ .modal{border-radius:var(--radius-l);} }
@keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal h3{font-family:var(--font-display); font-size:19px; font-weight:600; margin-bottom:4px;}
.modal .sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:18px;}
.modal-close{position:absolute; top:16px; right:16px; width:30px; height:30px; border-radius:50%; border:1px solid var(--rule); background:var(--surface-2); display:flex; align-items:center; justify-content:center;}
.modal-close svg{width:14px; height:14px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em;}
.field input, .field select, .field textarea{
  width:100%; padding:10px 12px; border:1px solid var(--rule); border-radius:var(--radius-s);
  background:var(--surface-2); font-family:inherit; font-size:14px; color:var(--ink);
}
.field input:focus, .field select:focus{outline:2px solid var(--navy-bright); outline-offset:1px;}
.priority-picker{display:flex; gap:8px;}
.pchip{flex:1; padding:9px 0; text-align:center; border-radius:var(--radius-s); border:1.5px solid var(--rule); font-size:12.5px; font-weight:600; background:var(--surface-2); color:var(--ink-soft);}
.pchip.sel{border-color:var(--navy-bright); color:var(--navy-bright); background:var(--surface-2);}
.check-row{display:flex; align-items:center; gap:9px; font-size:13px; font-weight:400; text-transform:none; letter-spacing:0; margin-bottom:9px; color:var(--ink);}
.check-row input{width:16px; height:16px; accent-color:var(--navy-bright); flex-shrink:0;}
.modal-submit{
  width:100%; padding:12px; border:none; border-radius:var(--radius-s); background:var(--panel); color:#eee7d3;
  font-weight:600; font-size:14px; margin-top:4px;
}
.modal-submit:hover{background:var(--navy-bright);}
.modal-submit.danger-btn{background:var(--seal);}
.modal-submit.danger-btn:hover{background:#7e2222;}
.modal-back{
  width:100%; padding:10px; border:1px solid var(--rule); border-radius:var(--radius-s); background:var(--surface-2); color:var(--ink-soft);
  font-weight:600; font-size:13px; margin-top:8px;
}
.info-block{background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--radius-m); padding:14px; font-size:13px; line-height:1.55; color:var(--ink-soft); margin-bottom:12px;}
.info-block b{color:var(--ink);}
.mini-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px;}
.mini-table th, .mini-table td{padding:7px 6px; border-bottom:1px solid var(--rule); text-align:left;}
.mini-table th{color:var(--ink-soft); font-weight:600; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase;}

/* caution / warning block used in the Close-daybook confirm modal */
.caution-block{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--seal-soft); border:1px solid #9c2b2b55; border-radius:var(--radius-m);
  padding:14px; margin-bottom:16px; color:var(--seal);
}
.caution-block svg{width:20px; height:20px; flex-shrink:0; margin-top:1px;}
.caution-block .ct{font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-bottom:4px; display:block;}
.caution-block p{font-size:13px; line-height:1.55; color:var(--seal);}

/* referral link row */
.ref-link-row{display:flex; gap:8px; margin-bottom:14px;}
.ref-link-row input{flex:1; padding:10px 12px; border:1px solid var(--rule); border-radius:var(--radius-s); background:var(--surface-2); font-family:var(--font-mono); font-size:12.5px; color:var(--ink);}
.ref-copy-btn{padding:0 16px; border:none; border-radius:var(--radius-s); background:var(--panel); color:#eee7d3; font-weight:600; font-size:12.5px;}

/* time log rows */
.tlog-row{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px dashed var(--rule-strong); font-size:12.5px; flex-wrap:wrap;}
.tlog-row:last-child{border-bottom:none;}
.tlog-date{font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); min-width:66px;}
.tlog-mid{flex:1; min-width:140px; color:var(--ink);}
.tlog-mid b{color:var(--sage);}
.tlog-mid b.non{color:var(--brass);}
.tlog-note{color:var(--ink-faint); font-size:11.5px;}
.tlog-edit-btn{font-size:11.5px; font-weight:600; color:var(--navy-bright); background:none; border:1px solid var(--rule); border-radius:100px; padding:4px 10px; flex-shrink:0;}
.tlog-edit-form{display:none; gap:8px; width:100%; margin-top:8px; flex-wrap:wrap;}
.tlog-edit-form.show{display:flex;}
.tlog-edit-form input{width:90px; padding:7px 8px; border:1px solid var(--rule); border-radius:6px; background:var(--surface); font-size:12px; font-family:inherit; color:var(--ink);}
.tlog-edit-form input.note-input{width:100%; flex:1 1 100%;}
.tlog-edit-form button{padding:7px 12px; border:none; border-radius:6px; background:var(--panel); color:#eee7d3; font-size:12px; font-weight:600;}

/* achievements list (Gratitude Vault) */
.ach-row{display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px dashed var(--rule-strong);}
.ach-row:last-child{border-bottom:none;}
.ach-check{width:22px; height:22px; border-radius:50%; background:var(--sage-soft); border:1.4px solid var(--sage); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--sage);}
.ach-check svg{width:12px; height:12px;}
.ach-title{font-size:13px; font-weight:500; flex:1;}
.ach-meta{font-size:10.5px; color:var(--ink-faint); font-family:var(--font-mono); white-space:nowrap;}

/* danger zones (Statistics) */
.danger-chip{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; padding:5px 10px; border-radius:100px; background:var(--seal-soft); color:var(--seal); border:1px solid #9c2b2b40; margin:3px 4px 3px 0;}
.stat-row{display:flex; justify-content:space-between; align-items:center; padding:9px 2px; border-bottom:1px dashed var(--rule-strong); font-size:13px;}
.stat-row:last-child{border-bottom:none;}
.stat-row span:first-child{color:var(--ink-soft);}
.stat-row b{font-family:var(--font-mono); color:var(--ink);}

/* ===== EMT modal: force full homepage-viewport sizing (placed last so it always wins) ===== */
.overlay.wide-open{padding:0; align-items:stretch; justify-content:stretch;}
.modal.modal-wide{
  max-width:100vw; width:100vw;
  max-height:100vh; height:100vh; height:100dvh;
  border-radius:0; margin:0;
  padding:24px 20px 40px;
}

/* ================= render: task list ================= */
let openMenuId = null;

function renderTasks(){
  const list = document.getElementById('taskList');
  const filtered = tasks.filter(t=>t.cat===activeCat);

  if(filtered.length===0){
    list.innerHTML = `<div class="empty-state">Nothing filed under ${activeCat} yet — add the first entry.</div>`;
    return;
  }

  list.innerHTML = filtered.map(t=>`
    <div class="task${t.done?' done':''}" data-id="${t.id}">
      <button class="check" aria-label="Mark done">${svg('check2')}</button>
      <div class="task-body">
        <span class="task-title">${t.title}</span>
        ${t.fromPlan?`<span class="task-meta"><span class="today-badge">Planning Ahead</span></span>`:''}
      </div>
      <div class="task-actions">
        <div class="menu-wrap">
          <button class="dots" aria-label="Task options">${svg('dots')}</button>
          <div class="menu${openMenuId===t.id?' open':''}">
            <button class="reschedule">Reschedule to tomorrow</button>
            <button class="danger delete">Delete task</button>
          </div>
        </div>
      </div>
    </div>`).join('');

  list.querySelectorAll('.task').forEach(el=>{
    const id = Number(el.dataset.id);
    el.querySelector('.check').onclick = ()=>{ toggleDone(id); };
    el.querySelector('.dots').onclick = (e)=>{ e.stopPropagation(); openMenuId = openMenuId===id? null : id; renderTasks(); };
    el.querySelector('.reschedule').onclick = ()=>{ rescheduleTask(id); };
    el.querySelector('.delete').onclick = ()=>{ deleteTask(id); };
  });
}
document.addEventListener('click', ()=>{ if(openMenuId!==null){ openMenuId=null; renderTasks(); } });

function toggleDone(id){
  const t=tasks.find(t=>t.id===id);
  t.done=!t.done;
  t.completedAt = t.done ? todayKey() : null;
  renderTasks(); renderTabStrip();
}
function deleteTask(id){ tasks = tasks.filter(t=>t.id!==id); openMenuId=null; renderTasks(); renderTabStrip(); }
function rescheduleTask(id){
  const t=tasks.find(t=>t.id===id);
  t.rescheduled = true;
  openMenuId=null;
  renderTasks();
  flashToast(`“${t.title.slice(0,28)}${t.title.length>28?'…':''}” moved to Planning Ahead for tomorrow.`);
}
function flashToast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div'); el.id='toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1b2a44;color:#eee7d3;padding:10px 16px;border-radius:100px;font-size:12.5px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:88vw;text-align:center;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity='1';
  clearTimeout(window.__t);
  window.__t = setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; }, 2200);
}

function fmtPlanDate(key){

/* pull any Planning Ahead entries dated today into the Daybook, once each */
function pullTodaysPlanIntoDaybook(){

      tasks.push({id:nextId++, title:item.title, cat:item.cat, done:false, fromPlan:true, planId:item.id});

  });
  render();
}

function pruneTimeLog(){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);
  timeLogEntries = timeLogEntries.filter(e=> new Date(e.date) >= cutoff);
}
function timeLogTotals(entries){
  const study = entries.filter(e=>e.type==='study').reduce((s,e)=>s+e.hours,0);
  const nonstudy = entries.filter(e=>e.type==='nonstudy').reduce((s,e)=>s+e.hours,0);
  return {study, nonstudy};
}
/* one row per date: Date · Study (Xh) · Non-study (Yh) · Note · Edit */
function renderTimeLogTable(){
  const wrap = document.getElementById('timeLogTable');
  const summary = document.getElementById('timeLogSummary');
  if(!wrap) return;
  const byDate = {};
  timeLogEntries.forEach(e=>{
    if(!byDate[e.date]) byDate[e.date] = {date:e.date, study:0, nonstudy:0, notes:[]};
    byDate[e.date][e.type] += e.hours;
    if(e.note) byDate[e.date].notes.push(e.note);
  });
  const rows = Object.values(byDate).sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,30);
  wrap.innerHTML = rows.map(r=>`
    <div class="tlog-row" data-date="${r.date}">
      <span class="tlog-date">${new Date(r.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</span>
      <span class="tlog-mid">Study (<b>${r.study.toFixed(1)}h</b>) · Non-study (<b class="non">${r.nonstudy.toFixed(1)}h</b>)${r.notes.length?` · <span class="tlog-note">${r.notes.join('; ')}</span>`:''}</span>
      <button class="tlog-edit-btn" data-edit="${r.date}">Edit</button>
      <div class="tlog-edit-form" id="tlogEdit-${r.date}">
        <input type="number" min="0" step="0.5" class="study-input" value="${r.study}" placeholder="Study h">
        <input type="number" min="0" step="0.5" class="non-input" value="${r.nonstudy}" placeholder="Non-study h">
        <input type="text" class="note-input" value="${r.notes.join('; ')}" placeholder="Note">
        <button class="save-edit" data-date="${r.date}">Save</button>
      </div>
    </div>`).join('') || `<div class="empty-state">No time logged yet.</div>`;

function svgPie(study, nonstudy, colorStudy, colorNon){
  const total = study+nonstudy;
  const size=120, r=52, cx=60, cy=60;
  if(total<=0){
    return `<svg class="pie-svg" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--rule)" stroke-width="14"/><text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="10" fill="var(--ink-faint)" font-family="var(--font-mono)">no data</text></svg>`;
  }
  const studyFrac = study/total;
  const circumference = 2*Math.PI*r;
  const studyLen = circumference*studyFrac;
  return `<svg class="pie-svg" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colorNon}" stroke-width="16"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colorStudy}" stroke-width="16"
      stroke-dasharray="${studyLen} ${circumference-studyLen}" stroke-dashoffset="${circumference*0.25}" stroke-linecap="round" transform="rotate(0 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)" font-family="var(--font-mono)">${Math.round(studyFrac*100)}%</text>
  </svg>`;
}

/* ================= CA Map: Obsidian-style force-directed note graph ================= */
/* nodes = every CA task (glowing brass) + every syllabus theme it's linked to (navy).
   physics: all nodes repel each other (charge), edges pull linked pairs together (spring),
   centring force keeps the cloud on-canvas. Dragging a node pins it in place.
   Clicking a node (without dragging) locks the highlight on it — its links glow,
   everything else dims — until you click it again or click empty canvas. Zoom via
   +/- buttons, mouse wheel, or pinch. */
let fgNodes = [];
let fgEdges = [];
let fgRAF = null;
let fgDrag = null;
let fgDragMoved = false;
let fgActiveId = null;
let fgZoom = 1;
const FG_W = 700, FG_H = 460;

function buildForceGraph(){
  const caTasks = tasks.filter(t=>t.cat==='CA' && t.themes && t.themes.length);
  const nodeMap = new Map();
  caTasks.forEach(t=>{
    nodeMap.set('t'+t.id, {id:'t'+t.id, label:t.title.length>26?t.title.slice(0,24)+'…':t.title, kind:'task', color:'brass'});
  });
  const usedThemes = new Set();
  caTasks.forEach(t=> t.themes.forEach(th=> usedThemes.add(th)));
  usedThemes.forEach(th=>{
    nodeMap.set('th_'+th, {id:'th_'+th, label:th, kind:'theme', color:'navy'});
  });
  const edges = [];
  caTasks.forEach(t=>{
    t.themes.forEach(th=> edges.push({a:'t'+t.id, b:'th_'+th}));
  });

  // preserve existing positions/velocities for nodes that already exist
  const prev = new Map(fgNodes.map(n=>[n.id, n]));
  fgNodes = Array.from(nodeMap.values()).map(n=>{
    const old = prev.get(n.id);
    if(old){ return {...n, x:old.x, y:old.y, vx:old.vx, vy:old.vy, pinned:old.pinned}; }
    return {...n, x: FG_W/2 + (Math.random()-0.5)*320, y: FG_H/2 + (Math.random()-0.5)*320, vx:0, vy:0, pinned:false};
  });
  fgEdges = edges;
}

function fgStep(){
  const nodes = fgNodes;
  const REPEL = 5200, SPRING_LEN = 150, SPRING_K = 0.02, DAMP = 0.86, CENTER_K = 0.0018;
  for(let i=0;i<nodes.length;i++){
    const a = nodes[i];
    if(a.pinned) continue;
    let fx=0, fy=0;
    for(let j=0;j<nodes.length;j++){
      if(i===j) continue;
      const b = nodes[j];
      let dx = a.x-b.x, dy = a.y-b.y;
      let d2 = dx*dx+dy*dy;
      if(d2<4) d2=4;
      const d = Math.sqrt(d2);
      const f = REPEL/d2;
      fx += (dx/d)*f; fy += (dy/d)*f;
    }
    // center pull
    fx += (FG_W/2 - a.x)*CENTER_K;
    fy += (FG_H/2 - a.y)*CENTER_K;
    a.fx = fx; a.fy = fy;
  }
  fgEdges.forEach(e=>{
    const a = nodes.find(n=>n.id===e.a), b = nodes.find(n=>n.id===e.b);
    if(!a||!b) return;
    let dx = b.x-a.x, dy = b.y-a.y;
    const d = Math.max(1, Math.sqrt(dx*dx+dy*dy));
    const stretch = d-SPRING_LEN;
    const f = stretch*SPRING_K;
    const ux=dx/d, uy=dy/d;
    if(!a.pinned){ a.fx += ux*f; a.fy += uy*f; }
    if(!b.pinned){ b.fx -= ux*f; b.fy -= uy*f; }
  });
  nodes.forEach(n=>{
    if(n.pinned){ n.vx=0; n.vy=0; return; }
    n.vx = (n.vx + (n.fx||0)*0.06) * DAMP;
    n.vy = (n.vy + (n.fy||0)*0.06) * DAMP;
    n.x = Math.min(FG_W-20, Math.max(20, n.x + n.vx));
    n.y = Math.min(FG_H-20, Math.max(20, n.y + n.vy));
  });
}

function fgPaint(){
  const wrap = document.getElementById('obsidianGraph');
  if(!wrap) return;
  const edgeLines = fgEdges.map(e=>{
    const a = fgNodes.find(n=>n.id===e.a), b = fgNodes.find(n=>n.id===e.b);
    if(!a||!b) return '';
    const active = fgActiveId && (fgActiveId===e.a || fgActiveId===e.b);
    return `<line x1="${a.x/FG_W*100}" y1="${a.y/FG_H*100}" x2="${b.x/FG_W*100}" y2="${b.y/FG_H*100}" class="g-edge${active?' active':''}" data-a="${e.a}" data-b="${e.b}"/>`;
  }).join('');
  const linked = new Set();
  if(fgActiveId){ linked.add(fgActiveId); fgEdges.forEach(e=>{ if(e.a===fgActiveId) linked.add(e.b); if(e.b===fgActiveId) linked.add(e.a); }); }
  const nodeEls = fgNodes.map(n=>{
    const dim = fgActiveId && !linked.has(n.id);
    const active = fgActiveId===n.id;
    return `<g class="g-node${dim?' dim':''}${active?' active':''}" data-id="${n.id}" transform="translate(${n.x/FG_W*100} ${n.y/FG_H*100})">
      <circle r="2.6" class="g-dot ${n.color}"/>
      <text x="0" y="-4.2" class="g-label">${n.label}</text>
    </g>`;
  }).join('');
  const half = 50/fgZoom;
  const cx = 50, cy = 50;
  const vbX = cx-half, vbY = cy-half, vbW = half*2, vbH = half*2;
  wrap.innerHTML = `<svg viewBox="${vbX} ${vbY} ${vbW} ${vbH}" class="graph-svg" id="fgSvg" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="gEdgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff8a3d"/>
        <stop offset="55%" stop-color="#ffcf6b"/>
        <stop offset="100%" stop-color="#ff8a3d"/>
      </linearGradient>
    </defs>
    <g class="g-edges">${edgeLines}</g>
    <g class="g-nodes">${nodeEls}</g>
  </svg>
  <div class="graph-controls">
    <button class="graph-zoom-btn" id="fgZoomIn" type="button">+</button>
    <button class="graph-zoom-btn" id="fgZoomOut" type="button">−</button>
  </div>`;
  wireGraphInteractions();
}

function fgTick(){
  fgStep();
  fgPaint();
  fgRAF = requestAnimationFrame(fgTick);
}

function fgSetZoom(z){
  fgZoom = Math.min(3, Math.max(0.5, z));
}

function wireGraphInteractions(){
  const svgEl = document.getElementById('fgSvg');
  if(!svgEl) return;
  const toLocal = (evt)=>{
    const pt = svgEl.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    const m = svgEl.getScreenCTM().inverse();
    const loc = pt.matrixTransform(m);
    return {x: (loc.x-(50-50/fgZoom))/(100/fgZoom)*FG_W, y: (loc.y-(50-50/fgZoom))/(100/fgZoom)*FG_H};
  };
  svgEl.querySelectorAll('.g-node').forEach(g=>{
    g.addEventListener('pointerdown', (evt)=>{
      evt.preventDefault();
      const id = g.dataset.id;
      const node = fgNodes.find(n=>n.id===id);
      if(!node) return;
      fgDrag = node;
      fgDragMoved = false;
      node.pinned = true;
      svgEl.classList.add('dragging');
      svgEl.setPointerCapture(evt.pointerId);
    });
    g.addEventListener('pointerup', ()=>{
      const id = g.dataset.id;
      if(!fgDragMoved){
        // treat as a click: toggle the highlight lock
        fgActiveId = fgActiveId===id ? null : id;
      }
    });
  });
  svgEl.addEventListener('pointermove', (evt)=>{
    if(!fgDrag) return;
    fgDragMoved = true;
    const p = toLocal(evt);
    fgDrag.x = Math.min(FG_W-20, Math.max(20,p.x));
    fgDrag.y = Math.min(FG_H-20, Math.max(20,p.y));
  });
  const release = ()=>{
    if(fgDrag){ fgDrag.pinned = false; }
    fgDrag = null;
    svgEl.classList.remove('dragging');
  };
  svgEl.addEventListener('pointerup', release);
  svgEl.addEventListener('pointerleave', release);
  svgEl.addEventListener('click', (evt)=>{
    if(evt.target === svgEl){ fgActiveId = null; }
  });
  svgEl.addEventListener('wheel', (evt)=>{
    evt.preventDefault();
    fgSetZoom(fgZoom + (evt.deltaY<0 ? 0.15 : -0.15));
  }, {passive:false});
  // basic pinch-to-zoom
  let pinchStartDist = null, pinchStartZoom = 1;
  svgEl.addEventListener('touchstart', (evt)=>{
    if(evt.touches.length===2){
      const dx = evt.touches[0].clientX-evt.touches[1].clientX;
      const dy = evt.touches[0].clientY-evt.touches[1].clientY;
      pinchStartDist = Math.hypot(dx,dy);
      pinchStartZoom = fgZoom;
    }
  }, {passive:true});
  svgEl.addEventListener('touchmove', (evt)=>{
    if(evt.touches.length===2 && pinchStartDist){
      const dx = evt.touches[0].clientX-evt.touches[1].clientX;
      const dy = evt.touches[0].clientY-evt.touches[1].clientY;
      const dist = Math.hypot(dx,dy);
      fgSetZoom(pinchStartZoom * (dist/pinchStartDist));
    }
  }, {passive:true});

  const zi = document.getElementById('fgZoomIn'), zo = document.getElementById('fgZoomOut');
  if(zi) zi.onclick = ()=> fgSetZoom(fgZoom+0.25);
  if(zo) zo.onclick = ()=> fgSetZoom(fgZoom-0.25);
}

function renderObsidianGraph(){
  buildForceGraph();
  fgZoom = 1;
  fgActiveId = null;
  if(fgRAF){ cancelAnimationFrame(fgRAF); fgRAF=null; }
  if(fgNodes.length===0){
    document.getElementById('obsidianGraph').innerHTML = `<div class="empty-state" style="color:#9aa1c4;">No CA entries linked yet — file a Current Affairs task and connect it to a theme to see it appear here.</div>`;
    return;
  }
  fgTick();
}

  document.getElementById('ptaDate').value = new Date().toISOString().slice(0,10);
  renderPtaSubjectMultiselect();
  renderPtaRounds();
  renderPtaSubjectPanel();

  document.getElementById('ptaTypeHLT').onclick = ()=>{ ptaSelectedType='HLT'; syncPtaType(); };
  document.getElementById('ptaTypeFLT').onclick = ()=>{ ptaSelectedType='FLT'; syncPtaType(); };

  document.getElementById('ptaSubjToggleBtn').onclick = (e)=>{
    ptaSubjectPanelOpen = !ptaSubjectPanelOpen;
    document.getElementById('ptaSubjectPanel').classList.toggle('show', ptaSubjectPanelOpen);
    e.currentTarget.classList.toggle('open', ptaSubjectPanelOpen);
  };
  document.getElementById('ptaSubjBtn').onclick = (e)=>{
    e.stopPropagation();
    document.getElementById('ptaSubjPanel').classList.toggle('open');
  };
  document.addEventListener('click', (e)=>{
    const panel = document.getElementById('ptaSubjPanel');
    if(panel && panel.classList.contains('open') && !e.target.closest('.multiselect')){ panel.classList.remove('open'); }
  });

  document.getElementById('ptaSave').onclick = savePtaTest;

  renderPtaList();
  renderPtaScoreChart();
  renderPtaSubjectChart();
}
function syncPtaType(){
  document.getElementById('ptaTypeHLT').classList.toggle('sel', ptaSelectedType==='HLT');
  document.getElementById('ptaTypeFLT').classList.toggle('sel', ptaSelectedType==='FLT');
}

/* ---------- subjects multi-select (All Subjects OR many specific ones) ---------- */
function renderPtaSubjectMultiselect(){
  const panel = document.getElementById('ptaSubjPanel');
  const items = ["All Subjects", ...SUBJECTS10];
  panel.innerHTML = items.map(s=>{
    const key = s==="All Subjects" ? "All" : s;
    const checked = ptaSelectedSubjects.includes(key);
    return `<label class="ms-item"><input type="checkbox" data-key="${key}" ${checked?'checked':''}> ${s}</label>`;
  }).join('');
  panel.querySelectorAll('input').forEach(cb=>{
    cb.onchange = ()=>{
      const key = cb.dataset.key;
      if(key==='All'){
        ptaSelectedSubjects = cb.checked ? ['All'] : [];
      } else {
        ptaSelectedSubjects = ptaSelectedSubjects.filter(k=>k!=='All');
        ptaSelectedSubjects = cb.checked
          ? [...ptaSelectedSubjects, key]
          : ptaSelectedSubjects.filter(k=>k!==key);
        if(ptaSelectedSubjects.length===0){ ptaSelectedSubjects=['All']; }
      }
      renderPtaSubjectMultiselect();
      document.getElementById('ptaSubjLabel').textContent = ptaSelectedSubjects.includes('All')
        ? 'All Subjects' : `${ptaSelectedSubjects.length} subject${ptaSelectedSubjects.length>1?'s':''} selected`;
    };
  });
}

      <div class="mini-inputs">

        <input type="number" min="0" id="ptaR${n}I" placeholder="Incorrect" value="0">
      </div>
    </div>`).join('');

      const c = Number(document.getElementById(`ptaR${n}C`).value)||0;
      const i = Number(document.getElementById(`ptaR${n}I`).value)||0;

/* ---------- save a new test ---------- */
function savePtaTest(){
  const name = document.getElementById('ptaName').value.trim();
  if(!name){ document.getElementById('ptaName').focus(); return; }
  const date = document.getElementById('ptaDate').value || new Date().toISOString().slice(0,10);
  const rounds = [1,2,3].map(n=>({
    c:Number(document.getElementById(`ptaR${n}C`).value)||0,
    i:Number(document.getElementById(`ptaR${n}I`).value)||0
  }));
  const sw = {};
  SUBJECTS10.forEach(s=>{
    const id = ptaSubjId(s);
    const c = Number(document.getElementById(`ptaSW${id}C`).value)||0;
    const i = Number(document.getElementById(`ptaSW${id}I`).value)||0;
    if(c || i){ sw[s] = {c,i}; }
  });
  ptaTests.push({
    id: nextPtaId++, name, type: ptaSelectedType, max: ptaSelectedType==='HLT' ? 100 : 200,
    date, subjects: [...ptaSelectedSubjects], rounds, sw
  });

  document.getElementById('ptaName').value='';
  renderPtaRounds();
  renderPtaSubjectPanel();
  ptaSelectedSubjects = ['All'];
  renderPtaSubjectMultiselect();
  document.getElementById('ptaSubjLabel').textContent = 'All Subjects';

  renderPtaList();
  renderPtaScoreChart();
  renderPtaSubjectChart();
  flashToast('Test saved to Prelims Test Analysis.');
}

/* ---------- logged-tests panel ---------- */
function renderPtaList(){
  const wrap = document.getElementById('ptaList');
  document.getElementById('ptaCount').textContent = ptaTests.length;
  const sorted = [...ptaTests].sort((a,b)=> new Date(b.date)-new Date(a.date));
  wrap.innerHTML = sorted.map(t=>{
    const marks = ptaTestMarks(t), acc = ptaTestAccuracy(t);
    const chips = Object.keys(t.sw).map(s=>{
      const d = t.sw[s]; const a = ptaAccuracy(d.c,d.i);
      const cls = a<35 ? 'low' : (a>70 ? 'high' : '');
      return `<span class="subj-chip ${cls}">${s} ${a.toFixed(0)}%</span>`;
    }).join('');
    return `<div class="test-card">
      <div class="test-card-head">
        <div>
          <h5>${t.name}</h5>
          <div class="test-card-meta">${t.type} · ${new Date(t.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})} · ${t.subjects.includes('All') ? 'All subjects' : t.subjects.join(', ')}</div>
        </div>
        <span class="marks-pill">${marks.toFixed(1)} / ${t.max} · ${acc.toFixed(1)}% acc.</span>
      </div>
      ${chips ? `<div class="subject-chips">${chips}</div>` : ''}
    </div>`;
  }).join('');
}

/* ---------- hand-drawn SVG line chart (no external library) ---------- */
function svgLineChart(series, xLabels, opts={}){
  const width=640, height=224, padL=34, padR=8, padT=10, padB=26;
  const plotW = width-padL-padR, plotH = height-padT-padB;
  const yMax = opts.yMax ?? 100, yMin = opts.yMin ?? 0;
  const n = xLabels.length;
  const X = i => n>1 ? padL + (plotW*i/(n-1)) : padL+plotW/2;
  const Y = v => padT + plotH - ((v-yMin)/(yMax-yMin))*plotH;
  let svg = `<svg viewBox="0 0 ${width} ${height}" class="chart-svg" preserveAspectRatio="none">`;
  for(let g=0; g<=4; g++){
    const v = yMin + (yMax-yMin)*g/4, y = Y(v);
    svg += `<line x1="${padL}" y1="${y}" x2="${width-padR}" y2="${y}" class="chart-grid"/>`;
    svg += `<text x="${padL-6}" y="${y+3}" class="chart-axis-label" text-anchor="end">${Math.round(v)}</text>`;
  }
  xLabels.forEach((lab,i)=>{
    if(n>12 && i%2!==0) return;
    svg += `<text x="${X(i)}" y="${height-8}" class="chart-axis-label" text-anchor="middle">${lab}</text>`;
  });
  series.forEach(s=>{
    const pts = s.points.filter(p=> p.y!==null && p.y!==undefined);
    if(pts.length){
      const poly = pts.map(p=>`${X(p.x)},${Y(p.y)}`).join(' ');
      svg += `<polyline points="${poly}" fill="none" stroke="${s.color}" stroke-width="2.2" class="chart-line" data-series="${s.key}"/>`;
      pts.forEach(p=> svg += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="${s.color}" data-series="${s.key}"/>`);
    }
  });
  svg += `</svg>`;
  return svg;
}

/* ---------- chart 3: score trajectory, HLT vs FLT (normalised to % of max marks) ---------- */
function renderPtaScoreChart(){
  const sorted = [...ptaTests].sort((a,b)=> new Date(a.date)-new Date(b.date));
  const hlt = sorted.filter(t=>t.type==='HLT');
  const flt = sorted.filter(t=>t.type==='FLT');
  const maxLen = Math.max(hlt.length, flt.length, 1);
  const xLabels = Array.from({length:maxLen}, (_,i)=> `Attempt ${i+1}`);
  const series = [
    {key:'hlt', color:'#9c2b2b', points: hlt.map((t,i)=>({x:i, y:(ptaTestMarks(t)/t.max)*100}))},
    {key:'flt', color:'#2e4a82', points: flt.map((t,i)=>({x:i, y:(ptaTestMarks(t)/t.max)*100}))},
  ];
  document.getElementById('ptaChartScore').innerHTML = svgLineChart(series, xLabels, {yMax:100, yMin:0});
}

/* ---------- chart 4: subject-wise trajectory, one line per subject, toggleable legend ---------- */
function renderPtaSubjectChart(){
  const sorted = [...ptaTests].sort((a,b)=> new Date(a.date)-new Date(b.date));
  const xLabels = sorted.map((t,i)=> `#${i+1}`);
  const series = SUBJECTS10.map(s=>({
    key:s, color: SUBJ_COLORS[s],
    points: sorted.map((t,i)=> t.sw[s] ? {x:i, y: ptaAccuracy(t.sw[s].c, t.sw[s].i)} : {x:i, y:null})
  }));
  document.getElementById('ptaChartSubjects').innerHTML = svgLineChart(series, xLabels, {yMax:100, yMin:0});

  const legend = document.getElementById('ptaSubjLegend');
  legend.innerHTML = SUBJECTS10.map(s=>`<span class="legend-chip" data-key="${s}"><span class="legend-dot" style="background:${SUBJ_COLORS[s]}"></span>${s}</span>`).join('');
  legend.querySelectorAll('.legend-chip').forEach(chip=>{
    chip.onclick = ()=>{
      chip.classList.toggle('off');
      const key = chip.dataset.key;
      const hide = chip.classList.contains('off');
      document.querySelectorAll(`#ptaChartSubjects [data-series="${key}"]`).forEach(el=>{
        el.style.display = hide ? 'none' : '';
      });
    };
  });
}

/* ================= full screen ================= */
function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function updateFsIcon(){
  document.getElementById('fullscreenToggle').innerHTML = svg(isFullscreen() ? 'compress' : 'expand');
}
function enterFullscreen(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if(req){ try{ const p = req.call(el); if(p && p.catch) p.catch(()=>{}); }catch(e){} }
}
function exitFullscreen(){
  const ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  if(ex){ try{ const p = ex.call(document); if(p && p.catch) p.catch(()=>{}); }catch(e){} }
}
document.getElementById('fullscreenToggle').onclick = ()=>{ isFullscreen() ? exitFullscreen() : enterFullscreen(); };
