<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Desk — Arena</title>

    <!-- SUPABASE CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SECURITY BOUNCER -->
    <script>
        const currentUser = localStorage.getItem("currentUser");
        if (!currentUser) {
            window.location.href = "index.html"; 
        }
    </script>

    <style>
        /* =========================================================
           RESET & ROOT (Lilac Aesthetic)
        ========================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-dark: #0a0a0a;
            --surface-color: #1c1c1e; /* Dark grey card background */
            --border-color: #2c2c2e;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --accent: #dfc5fe; /* Lilac from reference */
            --accent-hover: #cbb0eb;
        }

        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg-dark); color: var(--text-main);
            height: 100vh; overflow: hidden; display: flex;
        }

        /* =========================================================
           SIDEBAR NAVIGATION
        ========================================================= */
        .sidebar {
            width: 80px; height: 100%;
            background: #000000;
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; align-items: center; padding: 20px 0;
            transition: width 0.3s ease; z-index: 50;
        }
        .sidebar:hover { width: 220px; }
        .brand-mark {
            width: 32px; height: 32px; margin-bottom: 40px;
            background: var(--text-main); border-radius: 50%;
        }
        .nav-item {
            width: 100%; display: flex; align-items: center; padding: 15px 25px; cursor: pointer; color: var(--text-muted);
            transition: all 0.2s ease; overflow: hidden; white-space: nowrap;
        }
        .nav-item:hover, .nav-item.active {
            color: var(--text-main); background: #1c1c1e; border-left: 3px solid var(--accent);
        }
        .nav-icon { min-width: 24px; font-weight: 700; font-size: 16px; margin-right: 20px; }
        .nav-label { font-size: 13px; font-weight: 600; letter-spacing: 0.05em; opacity: 0; transition: opacity 0.3s ease; }
        .sidebar:hover .nav-label { opacity: 1; }
        .logout-btn { margin-top: auto; border-left: 3px solid #ff453a; }
        .logout-btn:hover { background: rgba(255,69,58,0.1); color: #ff453a; }

        /* =========================================================
           MAIN WORKSPACE
        ========================================================= */
        .workspace { flex-grow: 1; display: flex; flex-direction: column; height: 100%; position: relative; }

        .topbar {
            height: 70px; width: 100%; display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; border-bottom: 1px solid var(--border-color); background: #000000;
        }
        .topbar-left { font-size: 13px; font-weight: 500; color: var(--text-muted); }
        .user-profile { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
        .user-avatar {
            width: 36px; height: 36px; border-radius: 50%; background: var(--surface-color);
            display: flex; align-items: center; justify-content: center;
        }

        .arena-grid {
            flex-grow: 1; padding: 40px; overflow-y: auto;
            max-width: 900px; margin: 0 auto; width: 100%; /* Centers the content like a mobile app view */
        }

        /* =========================================================
           COMMAND CENTER (UI UPDATE BASED ON IMAGES)
        ========================================================= */
        .header-title {
            font-size: 42px; font-weight: 700; letter-spacing: -0.04em;
            margin-bottom: 30px; line-height: 1.1;
        }

        /* Massive Input & Submit Area */
        .new-task-card {
            background: var(--surface-color);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .task-input {
            background: #2c2c2e; border: none; border-radius: 16px;
            padding: 20px 24px; color: var(--text-main); font-size: 16px; outline: none;
            width: 100%; font-family: inherit;
        }
        .task-input::placeholder { color: #8e8e93; }
        .task-input:focus { background: #3a3a3c; }

        .add-task-btn {
            background: var(--accent); color: #000; font-weight: 600; font-size: 16px;
            padding: 20px; border: none; border-radius: 16px; cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            width: 100%; /* Impossible to miss */
        }
        .add-task-btn:hover { background: var(--accent-hover); }
        .add-task-btn:active { transform: scale(0.98); }

        /* Rendered Task Cards */
        .task-list { list-style: none; display: flex; flex-direction: column; gap: 16px; }
        
        .task-card {
            background: var(--surface-color);
            border-radius: 24px; padding: 24px;
            display: flex; flex-direction: column; gap: 15px;
            transition: opacity 0.3s ease; position: relative;
        }
        
        /* The most recent active task gets the Lilac background to mirror your left image */
        .task-card.primary:not(.completed) { background: var(--accent); color: #000; }
        .task-card.primary:not(.completed) .task-text { color: #000; }
        .task-card.primary:not(.completed) .checkbox { border-color: #000; }
        .task-card.primary:not(.completed) .chip { background: #ffffff; color: #000; }
        .task-card.primary:not(.completed) .delete-btn { color: #000; }

        .task-card.completed { opacity: 0.5; }

        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .chip {
            background: #2c2c2e; padding: 6px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
        }
        
        .card-body { display: flex; align-items: flex-start; gap: 16px; cursor: pointer; }
        
        /* Custom Circular Checkbox */
        .checkbox {
            width: 24px; height: 24px; border: 2px solid var(--text-muted); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            margin-top: 2px;
        }
        .task-card.completed .checkbox { background: var(--accent); border-color: var(--accent); }
        .task-card.completed .checkbox::after { content: "✓"; color: #000; font-size: 14px; font-weight: bold; }
        
        .task-text { font-size: 18px; font-weight: 500; line-height: 1.4; transition: color 0.2s ease; }
        .task-card.completed .task-text { text-decoration: line-through; color: var(--text-muted); }

        .delete-btn {
            background: transparent; border: none; font-size: 20px; cursor: pointer;
            color: var(--text-muted); padding: 5px; opacity: 0.4; transition: opacity 0.2s ease;
        }
        .delete-btn:hover { opacity: 1; color: #ff453a !important; }
        
        #loading-text { color: var(--text-muted); font-size: 14px; text-align: center; margin-top: 20px; }

    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="brand-mark"></div>
        <div class="nav-item active"><span class="nav-icon">≡</span><span class="nav-label">Command</span></div>
        <div class="nav-item"><span class="nav-icon">◱</span><span class="nav-label">Brainstorm</span></div>
        <div class="nav-item"><span class="nav-icon">◳</span><span class="nav-label">Engine</span></div>
        <div class="nav-item logout-btn" onclick="logout()"><span class="nav-icon">✕</span><span class="nav-label">End Session</span></div>
    </nav>

    <main class="workspace">
        <header class="topbar">
            <div class="topbar-left" id="live-date">Loading date...</div>
            <div class="user-profile">
                <span id="display-name">Operative</span>
                <div class="user-avatar" id="avatar-initial">O</div>
            </div>
        </header>

        <div class="arena-grid">
            
            <div class="header-title">Simplify<br>your targets 🎯</div>

            <!-- MASSIVE INPUT AREA -->
            <div class="new-task-card">
                <input type="text" id="new-task-input" class="task-input" placeholder="What is the next objective?" onkeypress="handleKeyPress(event)">
                <button class="add-task-btn" onclick="addTask()" id="add-btn">Add Target</button>
            </div>

            <div id="loading-text">Syncing with database...</div>
            
            <!-- RENDERED TASK CARDS -->
            <ul class="task-list" id="task-list">
                <!-- Tasks inject here -->
            </ul>

        </div>
    </main>

    <script>
        /* =========================================================
           1. SUPABASE CONNECTION (PASTE YOUR KEYS HERE!)
        ========================================================= */
        const SUPABASE_URL = 'https://qhtgcvubyaopldxmisas.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFodGdjdnVieWFvcGxkeG1pc2FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTIzNTQsImV4cCI6MjEwMjcyODM1NH0.p2IfhXkMhGNd1RkPkLLLqtIb9bcCBrVp_3WPcxn0eTg';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        /* =========================================================
           2. IDENTITY & UI SETUP
        ========================================================= */
        const userName = localStorage.getItem("currentUser") || "Operative";
        document.getElementById("display-name").innerText = userName;
        document.getElementById("avatar-initial").innerText = userName.charAt(0).toUpperCase();

        function updateDate() {
            const today = new Date();
            const options = { timeZone: 'Asia/Kolkata', weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById("live-date").innerText = today.toLocaleDateString('en-IN', options).toUpperCase();
        }
        updateDate();

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }

        /* =========================================================
           3. COMMAND CENTER LOGIC
        ========================================================= */
        const taskList = document.getElementById("task-list");
        const loadingText = document.getElementById("loading-text");
        const taskInput = document.getElementById("new-task-input");

        async function fetchTasks() {
            loadingText.style.display = "block";
            
            const { data, error } = await db
                .from('tasks')
                .select('*')
                .eq('student_name', userName) 
                .order('created_at', { ascending: false });

            loadingText.style.display = "none";
            if (!error) renderTasks(data);
        }

        function renderTasks(tasks) {
            taskList.innerHTML = ""; 
            if(tasks.length === 0) return;

            let isFirstActiveFound = false;

            tasks.forEach(task => {
                const li = document.createElement("li");
                
                // Determine if this is the "primary" card (first non-completed task) to give it the Lilac background
                let primaryClass = "";
                if (!task.is_completed && !isFirstActiveFound) {
                    primaryClass = "primary";
                    isFirstActiveFound = true;
                }

                li.className = `task-card ${task.is_completed ? 'completed' : ''} ${primaryClass}`;
                
                // Fake chip for aesthetic matching the image
                const chipText = task.is_completed ? "Archived" : "High Priority";

                li.innerHTML = `
                    <div class="card-header">
                        <div class="chip">${chipText}</div>
                        <button class="delete-btn" onclick="deleteTask('${task.id}')">✕</button>
                    </div>
                    <div class="card-body" onclick="toggleTask('${task.id}', ${task.is_completed})">
                        <div class="checkbox"></div>
                        <span class="task-text">${task.task_text}</span>
                    </div>
                `;
                taskList.appendChild(li);
            });
        }

        async function addTask() {
            const text = taskInput.value.trim();
            if (!text) return;

            const btn = document.getElementById("add-btn");
            btn.innerText = "Locking..."; btn.disabled = true;

            const { error } = await db.from('tasks').insert([{ student_name: userName, task_text: text }]);

            btn.innerText = "Add Target"; btn.disabled = false;
            taskInput.value = ""; 

            if (!error) fetchTasks();
        }

        async function toggleTask(id, currentStatus) {
            const { error } = await db.from('tasks').update({ is_completed: !currentStatus }).eq('id', id);
            if (!error) fetchTasks();
        }

        async function deleteTask(id) {
            const { error } = await db.from('tasks').delete().eq('id', id);
            if (!error) fetchTasks();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') addTask();
        }

        fetchTasks();
    </script>
</body>
</html>
