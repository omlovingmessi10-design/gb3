<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Desk — Arena</title>

    <!-- SECURITY BOUNCER: Must run before page loads -->
    <script>
        const currentUser = localStorage.getItem("currentUser");
        if (!currentUser) {
            window.location.href = "index.html"; // Kick back to login if not authenticated
        }
    </script>

    <style>
        /* =========================================================
           RESET & ROOT
        ========================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-dark: #050505;
            --panel-bg: rgba(20, 20, 20, 0.6);
            --border-glow: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f2;
            --text-muted: #888888;
            --accent: #f97316; /* Magic glow */
        }

        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Deep Space Background */
        body::before {
            content: ""; position: absolute; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #050505 60%);
        }

        /* =========================================================
           SIDEBAR NAVIGATION
        ========================================================= */
        .sidebar {
            width: 80px;
            height: 100%;
            background: linear-gradient(to bottom, rgba(10,10,10,0.9), rgba(5,5,5,0.95));
            border-right: 1px solid var(--border-glow);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            transition: width 0.3s ease;
            z-index: 50;
        }

        .sidebar:hover { width: 220px; }

        .brand-mark {
            width: 30px; height: 30px; margin-bottom: 40px;
            background: radial-gradient(circle, var(--text-main) 0%, #555 100%);
            border-radius: 4px; box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        .nav-item {
            width: 100%; display: flex; align-items: center;
            padding: 15px 25px; cursor: pointer; color: var(--text-muted);
            transition: all 0.2s ease; overflow: hidden; white-space: nowrap;
        }
        
        .nav-item:hover, .nav-item.active {
            color: var(--text-main); background: rgba(255,255,255,0.05);
            border-left: 3px solid var(--accent);
        }

        .nav-icon { min-width: 24px; font-weight: 700; font-size: 16px; margin-right: 20px; }
        .nav-label { font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0; transition: opacity 0.3s ease; }
        .sidebar:hover .nav-label { opacity: 1; }

        .logout-btn { margin-top: auto; border-left: 3px solid #ff4444; }

        /* =========================================================
           MAIN WORKSPACE
        ========================================================= */
        .workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        /* TOP BAR */
        .topbar {
            height: 70px; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; border-bottom: 1px solid var(--border-glow);
            backdrop-filter: blur(10px);
        }

        .topbar-left { font-size: 12px; font-weight: 500; letter-spacing: 0.15em; color: var(--text-muted); }
        .topbar-right { display: flex; align-items: center; gap: 20px; }
        
        .user-profile {
            display: flex; align-items: center; gap: 10px;
            font-size: 13px; font-weight: 600; letter-spacing: 0.05em; color: var(--text-main);
        }
        .user-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* ARENA GRID (Where modules will load) */
        .arena-grid {
            flex-grow: 1; padding: 40px; overflow-y: auto;
            display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px;
        }

        /* Placeholder Module Box */
        .module-box {
            grid-column: span 12;
            background: var(--panel-bg); border: 1px solid var(--border-glow);
            border-radius: 12px; padding: 30px; backdrop-filter: blur(20px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-muted); min-height: 400px;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR NAVIGATION -->
    <nav class="sidebar">
        <div class="brand-mark"></div>
        
        <div class="nav-item active">
            <span class="nav-icon">01</span><span class="nav-label">Command Center</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">02</span><span class="nav-label">Brainstorm Arena</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">03</span><span class="nav-label">CSAT Engine</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">04</span><span class="nav-label">Essay Forge</span>
        </div>

        <div class="nav-item logout-btn" onclick="logout()">
            <span class="nav-icon">✕</span><span class="nav-label">End Session</span>
        </div>
    </nav>

    <!-- MAIN WORKSPACE -->
    <main class="workspace">
        
        <!-- TOP BAR -->
        <header class="topbar">
            <div class="topbar-left" id="live-clock">INITIALIZING PROTOCOL...</div>
            
            <div class="topbar-right">
                <div class="user-profile">
                    <span id="display-name">Operative</span>
                    <div class="user-avatar" id="avatar-initial">O</div>
                </div>
            </div>
        </header>

        <!-- ARENA GRID -->
        <div class="arena-grid">
            <div class="module-box">
                <h2 style="color: var(--text-main); margin-bottom: 10px;">Workspace Secure.</h2>
                <p>Welcome to the Arena. The Command Center module will be installed here next.</p>
            </div>
        </div>

    </main>

    <script>
        // 1. Inject User Identity from Local Storage
        const userName = localStorage.getItem("currentUser") || "Operative";
        document.getElementById("display-name").innerText = userName;
        document.getElementById("avatar-initial").innerText = userName.charAt(0).toUpperCase();

        // 2. Live IST Clock
        function updateClock() {
            const now = new Date();
            const options = { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            document.getElementById("live-clock").innerText = "IST SECURE LINK — " + now.toLocaleTimeString('en-IN', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 3. Logout Protocol
        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
